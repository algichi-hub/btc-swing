name: G6 History and PnL regression
on:
  push:
    branches: ['fix/g6-history-partial-pnl-20261105']
  pull_request:
    paths:
      - 'app/storage/trade_repository.py'
      - 'app/static/**'
      - 'tests/test_g6_history_partial_pnl.py'
      - 'tests/test_g6_p3_history_prefetch_contract.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history-pnl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: python -m pip install -r requirements-f5.txt
      - name: Compile changed source and regression tests
        run: python -m compileall -q app tests
      - name: Functional history and PnL tests
        run: python -m pytest -q tests/test_g6_history_partial_pnl.py tests/test_g6_p3_history_prefetch_contract.py
      - name: Trade engine unchanged algorithm regression
        run: python -m pytest -q tests/test_f1_exits.py tests/test_f1_contracts.py
      - name: No modifications to trade engine paths
        run: |
          git diff --name-only origin/fix/g6-volume-transparent-pending...HEAD | tee /tmp/changed.txt
          if grep -E '^(app/automation/|app/strategy/|app/market/)' /tmp/changed.txt; then exit 1; fi

