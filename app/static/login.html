<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTC Swing Trade — Iniciar sesión</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <h1 class="login-title">BTC Swing Trade</h1>
      <div class="login-subtitle">Acceso restringido — Iniciar sesión</div>

      <div id="errorBanner" class="alert-banner alert-error hidden" role="alert"></div>
      <div id="infoBanner" class="alert-banner alert-info hidden" role="status"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="username">Usuario</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-control"
            autocomplete="username"
            required
            autofocus
          >
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">Iniciar sesión</button>
      </form>
    </div>
  </div>

  <script src="/static/login.js"></script>
</body>
</html>
