<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTC Swing Trade — Iniciar sesión</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#101827">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <h1 class="login-title">BTC Swing Trade</h1>
      <div class="login-subtitle">Acceso restringido — Iniciar sesión</div>

      <div id="errorBanner" class="alert-banner alert-error hidden" role="alert"></div>
      <div id="infoBanner" class="alert-banner alert-info hidden" role="status"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="username">Usuario</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-control"
            autocomplete="username"
            required
            autofocus
          >
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">Iniciar sesión</button>
      </form>
      <button type="button" class="recover-link" id="showRecovery">¿Olvidaste tu contraseña? Usar código de recuperación</button>
      <form id="recoveryForm" class="hidden" autocomplete="off">
        <h2>Recuperar contraseña</h2>
        <p class="maintenance-description">Introduce uno de tus códigos guardados. Cada código se puede utilizar una sola vez.</p>
        <div class="form-group"><label for="recoveryUsername">Usuario</label>
          <input id="recoveryUsername" type="text" autocomplete="username" class="form-control" required maxlength="64"></div>
        <div class="form-group"><label for="recoveryCode">Código de recuperación</label>
          <input id="recoveryCode" type="text" class="form-control" required maxlength="64" autocapitalize="off" spellcheck="false"></div>
        <div class="form-group"><label for="recoveryNewPassword">Nueva contraseña (mínimo 16 caracteres)</label>
          <input id="recoveryNewPassword" type="password" autocomplete="new-password" class="form-control" required minlength="16" maxlength="256"></div>
        <div class="form-group"><label for="recoveryConfirmPassword">Confirmar nueva contraseña</label>
          <input id="recoveryConfirmPassword" type="password" autocomplete="new-password" class="form-control" required minlength="16" maxlength="256"></div>
        <button id="recoverySubmit" class="btn-submit" type="submit">Recuperar acceso</button>
        <p id="recoveryFeedback" class="form-feedback" aria-live="polite"></p>
        <button type="button" class="recover-link" id="hideRecovery">Volver al login</button>
      </form>
    </div>
  </div>

  <script src="/static/login.js"></script>
  <script src="/static/pwa-install.js" defer></script>
</body>
</html>
